name: Keep Supabase awake

on:
  schedule:
    # 09:00 UTC = 14:00 Asia/Almaty, не совпадает с refresh-prices
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query items via PostgREST
        env:
          SUPABASE_URL: https://mnxxnomcwzsisusejuqx.supabase.co
          ANON_KEY: sb_publishable_Xc9cKMPuw-u_WrovC9fjCQ_Ai0xrG9-
        run: |
          body=$(curl -fsS --max-time 30 \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Response: $body"
          case "$body" in
            \[*) echo "OK: project is awake" ;;
            *) echo "Unexpected response, project may be paused"; exit 1 ;;
          esac
